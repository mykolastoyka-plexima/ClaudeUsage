name: Build

# Builds installers for every platform. Runs on demand (Actions → Build → Run
# workflow) and on version tags; a tag like v0.1.0 also publishes a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            id: macos-universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            out: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            out: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: Windows ARM64
            id: windows-arm64
            os: windows-latest
            rust_targets: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
            out: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.id }}

      - run: npm ci

      - name: Unit tests
        if: matrix.os == 'macos-latest'
        working-directory: src-tauri
        run: cargo test

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeUsage-${{ matrix.id }}
          path: ${{ matrix.out }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.out }}
          draft: true
